openapi: 3.0.3
info:
  title: STT internal worker API
  version: 1.0.0
  description: Private worker protocol, reserved in M01; no inference handler is
    installed yet. STT resolves stable platform aliases to its configured model registry;
    the Gateway forwards aliases unchanged. Provider identity remains internal. Access
    is limited to the STT-private worker network, with Gateway as the intended caller;
    network segmentation is not caller authentication. ADR 0009 defines the Compose
    topology. The Gateway sends remaining request budget in X-Request-Timeout-Ms.
    Client disconnect or deadline cancels queued work and
    requests cancellation of active work. STT attempts cooperative cancellation, then
    terminates its supervised inference subprocess after a configured grace. Capacity
    remains held until completion or confirmed child exit. Cancellation can finish after
    the HTTP connection closes; immediate GPU cleanup is not guaranteed. No STT-to-TTS
    calls or runtime model downloads.
paths:
  /internal/v1/transcriptions:
    post:
      operationId: internalSTT
      summary: Transcribe audio (contract only in M01)
      x-maxRequestSizeBytes: 26214400
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV PCM16, FLAC, MP3, Ogg/Opus or M4A/AAC. Default
                    25 MiB total request limit; deployment may lower it.
                language:
                  type: string
                  default: auto
                  minLength: 1
                  maxLength: 64
                  description: BCP-47 tag, or auto for automatic detection. Unsupported
                    languages return 400.
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Optional stable platform alias resolved by STT; configured
                    default when absent. This value is never a backend model identifier.
                timestamps:
                  type: boolean
                  default: false
                stream:
                  type: boolean
                  enum:
                  - false
                  default: false
                  description: Streaming reserved; true is rejected in M01-M04.
            encoding:
              audio:
                contentType: audio/wav, audio/flac, audio/mpeg, audio/ogg, audio/mp4
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '400':
          description: Invalid request or unsupported option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown platform model or voice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Configured request size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported audio media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Audio cannot be decoded or language cannot be detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Capacity exhausted; Retry-After may be provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Request deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: X-Request-Timeout-Ms
        required: true
        schema:
          type: integer
          minimum: 1
  /healthz:
    get:
      responses:
        '200':
          description: Process alive
  /readyz:
    get:
      responses:
        '200':
          description: Model loaded and able to accept work
        '503':
          description: Loading, fault-latched, draining or model unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          type: string
        segments:
          type: array
          description: Present only when supported and requested. Seconds relative
            to input start.
          items:
            type: object
            required:
            - start
            - end
            - text
            properties:
              start:
                type: number
                minimum: 0
              end:
                type: number
                minimum: 0
              text:
                type: string
    Model:
      type: object
      required:
      - id
      - languages
      - timestamps
      - streaming
      properties:
        id:
          type: string
          description: Stable platform alias, never engine-specific.
        languages:
          type: array
          items:
            type: string
        timestamps:
          type: boolean
        streaming:
          type: boolean
    Voice:
      type: object
      required:
      - id
      - languages
      - streaming
      properties:
        id:
          type: string
        languages:
          type: array
          items:
            type: string
        streaming:
          type: boolean
