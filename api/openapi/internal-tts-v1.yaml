openapi: 3.0.3
info:
  title: TTS internal worker API
  version: 1.0.0
  description: Private protocol for the existing TTS worker.
    Gateway translates platform aliases using configuration; internal provider selection
    never leaks into public API. Only gateway may reach worker network. Connection
    close stops response delivery but does not forcibly interrupt active native
    inference; the Gateway propagates its remaining request budget in X-Request-Timeout-Ms.
    Ordinary synthesis checks this deadline before loading and between segments;
    no later work starts after deadline exhaustion or detected disconnection.
    Missing timeout headers use the configured request_timeout_seconds default (600).
    Active native calls may finish after cancellation; this does not permit later segments.
    No STT-to-TTS calls. No runtime downloads.
paths:
  /internal/v1/speech:
    post:
      operationId: internalTTS
      parameters:
        - in: header
          name: X-Request-Timeout-Ms
          required: false
          description: Positive remaining milliseconds, capped by the configured worker request timeout.
          schema:
            type: integer
            minimum: 1
            maximum: 9999999999
      x-maxRequestSizeBytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 49152
                  description: Plain text is limited to 10000 characters. SSML is limited by worker configuration.
                voice:
                  type: string
                  enum: [default]
                  default: default
                language:
                  type: string
                  default: auto
                  enum: [auto, en, ru, sv]
                  description: For text input, auto has no metadata and explicit values are hints. For SSML, use xml:lang attributes and set this field to auto.
                mode:
                  type: string
                  enum: [quality, fast, auto, high_quality, extra_high_quality]
                  default: quality
                  description: quality uses 10 diffusion steps; fast uses 8 diffusion steps; high_quality uses 16 diffusion steps; extra_high_quality uses 32 diffusion steps; auto selects quality.
                input_format:
                  type: string
                  enum: [text, ssml]
                  default: text
                  description: Explicit input parser selection; default text preserves existing behavior.
                audio_processing:
                  type: string
                  enum: [none, gentle]
                  default: none
                  description: gentle runs bounded whole-program FFmpeg loudness adjustment, compression and peak protection; omitted or none preserves unprocessed audio.
      responses:
        '200':
          description: Complete WAV PCM16 audio.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request or unsupported option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown platform model or voice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Configured request size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported audio media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Audio cannot be decoded or language cannot be detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Capacity exhausted; Retry-After may be provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Synthesis deadline exceeded; native execution may still require completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Request deadline or bounded audio-processing deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: X-Request-Timeout-Ms
        required: true
        schema:
          type: integer
          minimum: 1
  /healthz:
    get:
      responses:
        '200':
          description: TTS control process is alive; this does not imply model readiness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [alive]
  /readyz:
    get:
      responses:
        '200':
          description: Worker can accept bounded on-demand work, including while the model is unloaded or loading
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: Worker is draining or has a known permanent artifact/runtime failure. Repair the reported cause; a later warmup or synthesis retries initialization. Transient resource shortages do not latch readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/warmup:
    post:
      operationId: warmup
      summary: Load the configured TTS model without synthesizing speech
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
              additionalProperties: false
      responses:
        '200':
          description: Warmup completed; response reports worker model state. No audio is synthesized.
          content:
            application/json:
              schema:
                type: object
                required: [model_state, inference_active]
                properties:
                  model_state:
                    type: string
                  inference_active:
                    type: boolean
        '429':
          description: Inference slot is busy
        '503':
          description: Model could not be loaded
  /internal/v1/state:
    get:
      operationId: modelState
      responses:
        '200':
          description: Model state and active inference flag; failure_category is present only for a known permanent failure
  /internal/v1/voices:
    get:
      operationId: listConfiguredVoices
      responses:
        '200':
          description: Configured voice alias and supported language hints
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          type: string
        segments:
          type: array
          description: Present only when supported and requested. Seconds relative
            to input start.
          items:
            type: object
            required:
            - start
            - end
            - text
            properties:
              start:
                type: number
                minimum: 0
              end:
                type: number
                minimum: 0
              text:
                type: string
    Model:
      type: object
      required:
      - id
      - languages
      - timestamps
      - streaming
      properties:
        id:
          type: string
          description: Stable platform alias, never engine-specific.
        languages:
          type: array
          items:
            type: string
        timestamps:
          type: boolean
        streaming:
          type: boolean
    Voice:
      type: object
      required:
      - id
      - languages
      - streaming
      properties:
        id:
          type: string
        languages:
          type: array
          items:
            type: string
        streaming:
          type: boolean
