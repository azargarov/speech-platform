openapi: 3.0.3
info:
  title: Speech Platform public API
  version: 1.0.0
  description: STT transcription, complete WAV TTS, optional text transformation and bounded predictive model warmup routes are implemented. Bearer authentication is required for public speech and text routes in every deployment; configure SPEECH_API_TOKEN as a private random secret of at least 32 characters. Health and readiness endpoints remain unauthenticated. TLS termination is external to Gateway; use a TLS reverse proxy and do not treat an advertised HTTPS URL as proof of TLS. STT request limit is 25 MiB; TTS JSON request limit is 64 KiB; model warmup request limit is 4 KiB. Warmup is synchronous, bounded by warmup_timeout, and can be called asynchronously by clients. It accepts operation names only and never accepts user content. A ready result confirms the warmup operation completed, not future model residency. The total ordinary speech deadline covers body reading, worker dispatch and buffered response completion; remaining budget is forwarded to workers. Default STT deadline is 180 seconds and TTS deadline is 600 seconds; upload read deadline is 30 seconds. Client disconnect cancels the Gateway wait where possible; it does not prove model loading stopped. For ordinary speech, deadline exhaustion returns HTTP 504 before response headers are committed when the connection remains writable; delivery already started may instead be terminated. Warmup retains per-operation timeout outcomes.
    Gateway responses include X-Request-ID, a Gateway-generated identifier
    suitable for correlating that request with Gateway and private worker logs,
    when UUID generation succeeds. Its failure returns a safe 500 without the
    header. Caller-provided values are not trusted. Streaming is reserved, not
    implemented; capability flags remain false until supported.
    Timestamps are optional; unsupported requests return 400. Errors never contain
    audio or transcript payloads. Text transformation is available only when an
    optional Gateway text_transform configuration is enabled; generated output
    is unverified and requires user review.
security:
- bearerAuth: []
paths:
  /v1/stt/transcriptions:
    post:
      operationId: transcribe
      summary: Transcribe audio and optionally translate when supported by the selected model
      x-maxRequestSizeBytes: 26214400
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV PCM16, FLAC, MP3, Ogg/Opus or M4A/AAC. Default
                    25 MiB total request limit; deployment may lower it.
                language:
                  type: string
                  default: auto
                  minLength: 1
                  maxLength: 64
                  enum: [auto, ru, en, sv]
                  description: Deprecated compatibility alias for source_language.
                source_language:
                  type: string
                  enum: [auto, ru, en, sv]
                  default: auto
                  description: Spoken language or automatic detection. Unsupported detected languages return 422.
                output_language:
                  type: string
                  enum: [auto, ru, en, sv]
                  default: auto
                  description: auto or same-language output returns transcription. Cross-language output depends on the selected model's configured translation capability; unsupported requests return HTTP 400 with code unsupported_translation.
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Optional platform alias for local STT. Groq uses the server-configured model and rejects a non-empty explicit model value.
                timestamps:
                  type: boolean
                  default: false
                stream:
                  type: boolean
                  enum:
                  - false
                  default: false
                  description: Streaming is not supported and true is rejected.
            encoding:
              audio:
                contentType: audio/wav, audio/flac, audio/mpeg, audio/ogg, audio/mp4
      parameters:
      - in: header
        name: X-Allow-Cloud-Audio
        required: false
        schema:
          type: string
          enum: ["true", "false"]
          default: "false"
        description: Per-request cloud-audio consent, independent of text transformation allow_cloud. Groq is never eligible without true.
      - in: header
        name: X-STT-Provider
        required: false
        schema:
          type: string
          enum: [local, groq]
        description: Pins this request to one provider. groq requires X-Allow-Cloud-Audio true. If omitted, requests stay local-only unless cloud-audio consent is true; then local is preferred and Groq may serve the request when local capacity is occupied. Provider errors are not retried on another provider.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID: &requestIdHeader
              description: Gateway-generated identifier for this request, also used in Gateway and private worker logs.
              schema:
                type: string
                format: uuid
            X-Speech-Provider:
              description: Provider that handled the request (local or groq).
              schema:
                type: string
                enum: [local, groq]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '400': &id001
          description: Invalid request or unsupported option
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Missing or invalid bearer token
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Cloud STT was explicitly selected without per-request cloud-audio consent.
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: Unknown platform model or voice
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id005
          description: Configured request size limit exceeded
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &id006
          description: Unsupported audio media type
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id007
          description: Input cannot be processed or a requested mode is unavailable
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id008
          description: Gateway queue full or Groq rate limit; Retry-After may be provided
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id009
          description: Internal failure
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id010
          description: Enabled worker/provider unavailable, or this speech capability is disabled. Disabled STT/TTS returns capability_disabled; an enabled but unavailable provider returns provider_unavailable or not_ready.
          headers:
            X-Request-ID: *requestIdHeader
            X-Speech-Capability-State:
              description: Optional diagnostic state for an explicitly selected provider; disabled or unavailable. The existing provider_unavailable code is retained for explicitly selected disabled Groq STT.
              schema:
                type: string
                enum: [disabled, unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504': &id011
          description: Request deadline exceeded
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tts/speech:
    post:
      operationId: synthesize
      x-maxRequestSizeBytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 49152
                  description: Plain text is limited to 10000 characters. SSML input is limited by the configured document byte and speech-character bounds.
                voice:
                  type: string
                  enum: [default]
                  default: default
                  description: Compatibility field; only the configured default voice is available.
                language:
                  type: string
                  default: auto
                  enum: [auto, en, ru, sv]
                  description: For text input, auto sends text without language metadata and explicit codes are model hints. For SSML, use xml:lang attributes and set this field to auto. No detected language code is returned.
                mode:
                  type: string
                  enum: [quality, fast, auto, high_quality, extra_high_quality]
                  default: quality
                  description: quality uses 10 diffusion steps; fast uses 8 diffusion steps; high_quality uses 16 diffusion steps; extra_high_quality uses 32 diffusion steps; auto selects quality.
                input_format:
                  type: string
                  enum: [text, ssml]
                  default: text
                  description: Explicitly selects plain text or the documented bounded SSML 1.1 subset. XML is never inferred from text content.
                audio_processing:
                  type: string
                  enum: [none, gentle]
                  default: none
                  description: Optional bounded FFmpeg mastering. gentle applies conservative whole-program loudness adjustment, compression and peak protection; it does not select or stabilize a speaker.
      responses:
        '200':
          description: Complete WAV PCM16 audio. Sample rate is encoded in the WAV header.
          headers:
            X-Request-ID: *requestIdHeader
            X-Speech-Provider:
              description: Provider that handled the request (currently local).
              schema:
                type: string
                enum: [local]
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '413': *id005
        '415': *id006
        '422': *id007
        '429': *id008
        '500': *id009
        '503': *id010
        '504': *id011
        '502':
          description: Selected provider returned an invalid or unusable response
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tts/voices:
    get:
      operationId: listVoices
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voice'
        '401': *id002
        '403': *id003
        '500': *id009
        '503': *id010
  /v1/text/transformations:
    post:
      operationId: transformText
      summary: Optionally transform or translate text through a configured provider
      x-maxRequestSizeBytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextTransformRequest'
      responses:
        '200':
          description: Exact raw passthrough or generated text with provenance metadata
          headers:
            X-Request-ID: *requestIdHeader
            X-Speech-Prompt-SHA256:
              description: SHA-256 fingerprint of the active prompt snapshot used to handle this request.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextTransformResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '413': *id005
        '415': *id006
        '422': *id007
        '429': *id008
        '502':
          description: Provider rejected the request, violated protocol, or returned invalid output
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Transformation disabled, provider unavailable, or Gateway shutting down.
          headers:
            X-Request-ID: *requestIdHeader
            X-Speech-Capability-State:
              description: Disabled when text transformation is disabled in Gateway configuration; unavailable when the Gateway is stopping.
              schema:
                type: string
                enum: [disabled, unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504': *id011
  /v1/models/warmup:
    post:
      operationId: warmupModels
      summary: Prepare configured local inference operations without user content
      x-maxRequestSizeBytes: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelWarmupRequest'
      responses:
        '200':
          description: All requested operations were attempted; individual failures are reported in results
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelWarmupResponse'
        '400': *id001
        '401': *id002
        '405':
          description: POST is required
          headers:
            X-Request-ID: *requestIdHeader
        '413': *id005
        '415': *id006
        '408':
          description: Bounded request body did not complete before the warmup deadline
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Gateway cannot attempt any requested operation
          headers:
            X-Request-ID: *requestIdHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ModelWarmupRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [stt, tts, text_transform]
    ModelWarmupResult:
      type: object
      additionalProperties: false
      required: [operation, status]
      properties:
        operation:
          type: string
          enum: [stt, tts, text_transform]
        status:
          type: string
          enum: [ready, warming, unavailable, resource_unavailable, overloaded, timed_out, not_attempted]
        code:
          type: string
          maxLength: 64
    ModelWarmupResponse:
      type: object
      additionalProperties: false
      required: [results, complete]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ModelWarmupResult'
        complete:
          type: boolean
      description: Results preserve request order. complete is true only when every status is ready. Warming does not guarantee residency after completion.
    TextTransformRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description: UTF-8 input; configured byte and context limits also apply.
        mode:
          type: string
          enum: [raw, written, polite, diplomatic]
          default: raw
        format:
          type: string
          enum: [normal, concise, structured]
          default: normal
        target_language:
          type: string
          enum: [none, en, sv, ru]
          default: none
        model:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: Optional configured logical model alias; explicit selection never falls back.
        local_only:
          type: boolean
          default: false
      description: When mode is raw, format must be normal. Validation is enforced by the Gateway.
    TextTransformOptions:
      type: object
      additionalProperties: false
      required: [mode, format, target_language, model, local_only]
      properties:
        mode:
          type: string
          enum: [raw, written, polite, diplomatic]
        format:
          type: string
          enum: [normal, concise, structured]
        target_language:
          type: string
          enum: [none, en, sv, ru]
        model:
          type: string
          nullable: true
        local_only:
          type: boolean
    TextTransformResponse:
      type: object
      additionalProperties: false
      required: [original_text, transformed_text, options, model, provider, fallback_occurred, generated]
      properties:
        original_text:
          type: string
        transformed_text:
          type: string
        options:
          $ref: '#/components/schemas/TextTransformOptions'
        model:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        fallback_occurred:
          type: boolean
        generated:
          type: boolean
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          type: string
          description: Compatibility alias for detected_language.
        transcription:
          type: string
          description: Raw transcription in the detected spoken language.
        detected_language:
          type: string
        source_language:
          type: string
        output_language:
          type: string
        language_probability:
          type: number
          minimum: 0
          maximum: 1
          description: Present only for automatic detection when provided by the model.
        translated:
          type: boolean
          description: True only when a translation-capable selected model performed cross-language translation.
        segments:
          type: array
          description: Present only when supported and requested. Seconds relative
            to input start.
          items:
            type: object
            required:
            - start
            - end
            - text
            properties:
              start:
                type: number
                minimum: 0
              end:
                type: number
                minimum: 0
              text:
                type: string
    Voice:
      type: object
      required:
      - id
      - languages
      - streaming
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        languages:
          type: array
          items:
            type: string
        streaming:
          type: boolean
