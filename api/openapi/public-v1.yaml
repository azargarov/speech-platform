openapi: 3.0.3
info:
  title: Speech Platform public API
  version: 1.0.0
  description: STT transcription route is implemented. Optional bearer authentication is enforced when configured; non-loopback host exposure requires a secret token. Default total request limit 25 MiB;
    TTS text ceiling 10000 characters. Deployment limits and deadlines are configured
    and may be stricter; clients handle 413 and 504. Default deadline 180 seconds;
    upload read deadline 30 seconds. Client disconnect cancels the Gateway context and
    requests downstream cancellation; resource cleanup may finish asynchronously, and
    no result is returned to a disconnected client. Deadline exhaustion returns 504
    where the connection remains writable.
    Streaming is reserved, not implemented; capability flags remain false until supported.
    Timestamps are optional; unsupported requests return 400. Errors never contain
    audio or transcript payloads.
security:
- bearerAuth: []
- {}
paths:
  /v1/stt/transcriptions:
    post:
      operationId: transcribe
      summary: Transcribe audio and optionally translate to English
      x-maxRequestSizeBytes: 26214400
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV PCM16, FLAC, MP3, Ogg/Opus or M4A/AAC. Default
                    25 MiB total request limit; deployment may lower it.
                language:
                  type: string
                  default: auto
                  minLength: 1
                  maxLength: 64
                  enum: [auto, ru, en, sv]
                  description: Deprecated compatibility alias for source_language.
                source_language:
                  type: string
                  enum: [auto, ru, en, sv]
                  default: auto
                  description: Spoken language or automatic detection. Unsupported detected languages return 422.
                output_language:
                  type: string
                  enum: [auto, ru, en, sv]
                  default: auto
                  description: auto or same-language output returns transcription. Cross-language output is currently available only to English using Whisper translation; other pairs return unsupported_translation.
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Optional platform alias; configured default when absent.
                timestamps:
                  type: boolean
                  default: false
                stream:
                  type: boolean
                  enum:
                  - false
                  default: false
                  description: Streaming reserved; true is rejected in M01-M04.
            encoding:
              audio:
                contentType: audio/wav, audio/flac, audio/mpeg, audio/ogg, audio/mp4
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '400': &id001
          description: Invalid request or unsupported option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: Unknown platform model or voice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id005
          description: Configured request size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &id006
          description: Unsupported audio media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id007
          description: Audio cannot be decoded or language cannot be detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id008
          description: Capacity exhausted; Retry-After may be provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id009
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id010
          description: Provider not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504': &id011
          description: Request deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tts/speech:
    post:
      operationId: synthesize
      x-maxRequestSizeBytes: 26214400
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              - voice
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 10000
                voice:
                  type: string
                  minLength: 1
                  maxLength: 128
                language:
                  type: string
                  default: auto
                  minLength: 1
                  maxLength: 64
                  description: BCP-47 tag or auto. Auto uses provider text detection
                    when supported; otherwise returns 400.
                format:
                  type: string
                  enum:
                  - wav
                  - mp3
                  - opus
                  default: wav
                stream:
                  type: boolean
                  enum:
                  - false
                  default: false
      responses:
        '200':
          description: Complete audio; Content-Type matches requested format. Unsupported
            formats return 400. WAV is PCM16; Opus uses Ogg container. Sample rate
            is provider-selected and encoded in the audio header.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '413': *id005
        '415': *id006
        '422': *id007
        '429': *id008
        '500': *id009
        '503': *id010
        '504': *id011
  /v1/stt/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '401': *id002
        '403': *id003
        '500': *id009
        '503': *id010
  /v1/tts/voices:
    get:
      operationId: listVoices
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voice'
        '401': *id002
        '403': *id003
        '500': *id009
        '503': *id010
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          type: string
          description: Compatibility alias for detected_language.
        transcription:
          type: string
          description: Raw transcription in the detected spoken language.
        detected_language:
          type: string
        source_language:
          type: string
        output_language:
          type: string
        language_probability:
          type: number
          minimum: 0
          maximum: 1
          description: Present only for automatic detection when provided by the model.
        translated:
          type: boolean
        segments:
          type: array
          description: Present only when supported and requested. Seconds relative
            to input start.
          items:
            type: object
            required:
            - start
            - end
            - text
            properties:
              start:
                type: number
                minimum: 0
              end:
                type: number
                minimum: 0
              text:
                type: string
    Model:
      type: object
      required:
      - id
      - languages
      - timestamps
      - streaming
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable platform alias, never engine-specific.
        languages:
          type: array
          items:
            type: string
        timestamps:
          type: boolean
        streaming:
          type: boolean
    Voice:
      type: object
      required:
      - id
      - languages
      - streaming
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        languages:
          type: array
          items:
            type: string
        streaming:
          type: boolean
