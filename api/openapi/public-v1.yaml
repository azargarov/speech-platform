openapi: 3.0.3
info:
  title: Speech Platform public API
  version: 1.0.0
  description: STT transcription and complete WAV TTS routes are implemented. Optional bearer authentication is enforced when configured; non-loopback host exposure requires a secret token. STT request limit is 25 MiB; TTS JSON request limit is 64 KiB. Plain-text input is limited to 10000 characters; SSML has a 49152-byte document limit and a configured speech-character limit. Default STT deadline is 180 seconds and TTS deadline is 600 seconds; upload read deadline is 30 seconds. Client disconnect cancels the Gateway request and stops response delivery; active native TTS inference may finish asynchronously, and no result is returned to a disconnected client. Deadline exhaustion returns 504 where the connection remains writable.
    Streaming is reserved, not implemented; capability flags remain false until supported.
    Timestamps are optional; unsupported requests return 400. Errors never contain
    audio or transcript payloads.
security:
- bearerAuth: []
- {}
paths:
  /v1/stt/transcriptions:
    post:
      operationId: transcribe
      summary: Transcribe audio and optionally translate when supported by the selected model
      x-maxRequestSizeBytes: 26214400
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV PCM16, FLAC, MP3, Ogg/Opus or M4A/AAC. Default
                    25 MiB total request limit; deployment may lower it.
                language:
                  type: string
                  default: auto
                  minLength: 1
                  maxLength: 64
                  enum: [auto, ru, en, sv]
                  description: Deprecated compatibility alias for source_language.
                source_language:
                  type: string
                  enum: [auto, ru, en, sv]
                  default: auto
                  description: Spoken language or automatic detection. Unsupported detected languages return 422.
                output_language:
                  type: string
                  enum: [auto, ru, en, sv]
                  default: auto
                  description: auto or same-language output returns transcription. Cross-language output depends on the selected model's configured translation capability; unsupported requests return HTTP 400 with code unsupported_translation.
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Optional platform alias; configured default when absent.
                timestamps:
                  type: boolean
                  default: false
                stream:
                  type: boolean
                  enum:
                  - false
                  default: false
                  description: Streaming reserved; true is rejected in M01-M04.
            encoding:
              audio:
                contentType: audio/wav, audio/flac, audio/mpeg, audio/ogg, audio/mp4
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '400': &id001
          description: Invalid request or unsupported option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: Unknown platform model or voice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id005
          description: Configured request size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415': &id006
          description: Unsupported audio media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id007
          description: Input cannot be processed or a requested mode is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id008
          description: Capacity exhausted; Retry-After may be provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id009
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id010
          description: Provider not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504': &id011
          description: Request deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tts/speech:
    post:
      operationId: synthesize
      x-maxRequestSizeBytes: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 49152
                  description: Plain text is limited to 10000 characters. SSML input is limited by the configured document byte and speech-character bounds.
                voice:
                  type: string
                  enum: [default]
                  default: default
                  description: Compatibility field; only the configured default voice is available.
                language:
                  type: string
                  default: auto
                  enum: [auto, en, ru, sv]
                  description: For text input, auto sends text without language metadata and explicit codes are model hints. For SSML, use xml:lang attributes and set this field to auto. No detected language code is returned.
                mode:
                  type: string
                  enum: [quality, fast, auto, high_quality]
                  default: quality
                  description: quality uses 10 diffusion steps; fast uses 8 diffusion steps; high_quality uses 16 diffusion steps; auto selects quality.
                input_format:
                  type: string
                  enum: [text, ssml]
                  default: text
                  description: Explicitly selects plain text or the documented bounded SSML 1.1 subset. XML is never inferred from text content.
      responses:
        '200':
          description: Complete WAV PCM16 audio. Sample rate is encoded in the WAV header.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '413': *id005
        '415': *id006
        '422': *id007
        '429': *id008
        '500': *id009
        '503': *id010
        '504': *id011
  /v1/stt/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '401': *id002
        '403': *id003
        '500': *id009
        '503': *id010
  /v1/tts/voices:
    get:
      operationId: listVoices
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voice'
        '401': *id002
        '403': *id003
        '500': *id009
        '503': *id010
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
    Transcription:
      type: object
      required:
      - text
      - language
      properties:
        text:
          type: string
        language:
          type: string
          description: Compatibility alias for detected_language.
        transcription:
          type: string
          description: Raw transcription in the detected spoken language.
        detected_language:
          type: string
        source_language:
          type: string
        output_language:
          type: string
        language_probability:
          type: number
          minimum: 0
          maximum: 1
          description: Present only for automatic detection when provided by the model.
        translated:
          type: boolean
          description: True only when a translation-capable selected model performed cross-language translation.
        segments:
          type: array
          description: Present only when supported and requested. Seconds relative
            to input start.
          items:
            type: object
            required:
            - start
            - end
            - text
            properties:
              start:
                type: number
                minimum: 0
              end:
                type: number
                minimum: 0
              text:
                type: string
    Model:
      type: object
      required:
      - id
      - languages
      - timestamps
      - streaming
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable platform alias, never engine-specific.
        languages:
          type: array
          items:
            type: string
        timestamps:
          type: boolean
        streaming:
          type: boolean
    Voice:
      type: object
      required:
      - id
      - languages
      - streaming
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        languages:
          type: array
          items:
            type: string
        streaming:
          type: boolean
